<header class="fav-head">
  <div>
    <p class="eyebrow">Saved on this device</p>
    <h1 class="fav-head__title">Favorites</h1>
  </div>
  @if (favorites$().length > 0) {
    <button type="button" class="pa-btn pa-btn--ghost" (click)="clearAll()">Clear all</button>
  }
</header>

@switch (state()) {
  @case ('loading') {
    <pa-loader label="Loading favorites" />
  }
  @case ('error') {
    <pa-empty-state
      title="Couldn't load favorites"
      message="We couldn't reach PokeAPI to hydrate your saved Pokemon."
    />
  }
  @case ('ready') {
    @if (favorites$().length === 0) {
      <pa-empty-state
        title="No favorites yet"
        message="Tap the heart on any Pokemon card to pin it here. Your picks persist across sessions."
      >
        <a class="pa-btn pa-btn--primary" routerLink="/dex">Browse the Pokedex</a>
      </pa-empty-state>
    } @else {
      <div class="grid">
        @for (p of favorites$(); track p.id) {
          <pa-pokemon-card
            [pokemon]="p"
            [isFavorite]="true"
            [inTeam]="inTeam(p.id)"
            (favoriteToggle)="toggleFavorite($event)"
            (teamToggle)="toggleTeam($event)"
          />
        }
      </div>
    }
  }
}
